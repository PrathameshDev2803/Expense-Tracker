name: CI and Deploy Expense Tracker

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expense-tracker-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate PHP and optionally deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, pdo, json
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish --no-interaction

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Verify real environment files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_env_files" ]]; then
            echo "::error::A real environment file is tracked by Git. Remove it from the repository and rotate any exposed credentials."
            printf '%s\n' "$tracked_env_files"
            exit 1
          fi

      - name: Run PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            ! -path './vendor/*' \
            ! -path './.git/*' \
            ! -path './.github/*' \
            -print0 | xargs -0 -r -n1 php -l

      - name: Check FTP deployment configuration
        id: check_ftp
        env:
          FTP_HOST: ${{ secrets.INFINITYFREE_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.INFINITYFREE_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$FTP_HOST" ]] || missing+=("INFINITYFREE_FTP_HOST")
          [[ -n "$FTP_USERNAME" ]] || missing+=("INFINITYFREE_FTP_USERNAME")
          [[ -n "$FTP_PASSWORD" ]] || missing+=("INFINITYFREE_FTP_PASSWORD")
          [[ -n "$FTP_REMOTE_DIR" ]] || missing+=("INFINITYFREE_FTP_REMOTE_DIR")

          if [ ${#missing[@]} -eq 0 ]; then
            remote_dir="$FTP_REMOTE_DIR"
            [[ "$remote_dir" == */ ]] || remote_dir="${remote_dir}/"
            echo "has_ftp=true" >> "$GITHUB_OUTPUT"
            echo "remote_dir=$remote_dir" >> "$GITHUB_OUTPUT"
            echo "All required FTP secrets detected. Target remote directory: $remote_dir"
          else
            echo "has_ftp=false" >> "$GITHUB_OUTPUT"
            echo "FTP deployment skipped. Missing secrets: ${missing[*]}"
          fi

      - name: Deploy website using explicit FTPS
        if: steps.check_ftp.outputs.has_ftp == 'true'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.INFINITYFREE_FTP_HOST }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: ${{ steps.check_ftp.outputs.remote_dir }}
          dangerous-clean-slate: false
          timeout: 60000
          log-level: standard
          exclude: |
            **/.env*
            **/.git*
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            **/README.md
            **/sql/**
            **/*.sql
            **/*.log
            **/inht-backup/**
            **/tests/**
            **/test/**
